backend:
  name: git-gateway
  branch: main 

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Редагування сайту"
    files:
      - label: "Головна сторінка"
        name: "home"
        file: "data.json" # CMS буде зберігати дані у цей файл
        fields:
          - {label: "Головний заголовок", name: "title", widget: "string", default: "Гірлянда Бахрома вулична 105 LED"}
          - {label: "Акційна ціна, ₴", name: "price", widget: "string", default: "363"}
          - {label: "Стара ціна, ₴", name: "old_price", widget: "string", default: "669"}
          - {label: "Залишок на складі, шт", name: "stock", widget: "string", default: "448"}
