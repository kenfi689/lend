backend:
  name: git-gateway
  branch: main 

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Налаштування сторінки"
    files:
      - label: "Головна"
        name: "home"
        file: "data.json"
        fields:
          - {label: "Заголовок сторінки", name: "title", widget: "string", default: "Гірлянда Бахрома вулична 105 LED"}
          - {label: "Акційна ціна (грн)", name: "promo_price", widget: "number", value_type: "int", default: 363}
          - {label: "Гуртова ціна від 2 шт (грн)", name: "wholesale_price", widget: "number", value_type: "int", default: 340}
          - {label: "Стара ціна (грн)", name: "old_price", widget: "number", value_type: "int", default: 669}
          - {label: "Залишок на складі", name: "stock", widget: "number", value_type: "int", default: 448}
