backend:
  name: git-gateway
  branch: main # Вкажіть вашу головну гілку (main або master)

media_folder: "images/uploads" # Куди зберігатимуться завантажені фото
public_folder: "/images/uploads"

collections:
  - name: "varta_catalog"
    label: "Каталог Варта"
    folder: "content/products" # Папка, де створюватимуться markdown-файли з товарами
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Модель сигналізатора", name: "title", widget: "string"}
      - {label: "Головне фото", name: "image", widget: "image", required: false}
      - {label: "Короткі характеристики", name: "description", widget: "text"}
      - {label: "Технічний опис", name: "body", widget: "markdown"}